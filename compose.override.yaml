# Development overrides, merged automatically by plain `docker compose ...`.
# Source is bind-mounted for hot reload. Ports bind to 127.0.0.1 unless
# BIND_ADDR says otherwise, so a dev stack is not reachable from the network
# (published ports bypass host firewalls such as ufw).
services:
  api:
    build:
      target: dev
      # Your UID and GID for the image's `dev` user (make exports them).
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8010}:8010"
    environment:
      # The working tree, not a release: IMAGE_TAG in .env belongs to the
      # production stack's deploys.
      APP_VERSION: dev
      # The Vite dev proxy sets X-Forwarded-For (xfwd), like nginx in prod.
      FORWARDED_ALLOW_IPS: "*"
      # Sign-in in development: the browser is on the Vite dev server, over
      # plain HTTP, and reaches Keycloak through its /auth proxy. Browsers
      # drop Secure cookies on http://, so these cannot be Secure here.
      PUBLIC_URL: http://localhost:${WEB_PORT:-5173}
      OIDC_ISSUER: http://localhost:${WEB_PORT:-5173}/auth/realms/triage
      SESSION_COOKIE_SECURE: "false"
      # Evals only (make evals), so development only: the key of a judge at
      # another provider than the model under test. Empty: LLM_API_KEY.
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
    volumes:
      - ./apps/api:/api
      # Anonymous volume: keeps the image's .venv visible under the bind
      # mount. It survives rebuilds, so after a dependency change use
      # `make rebuild` (up --build --renew-anon-volumes), not plain --build.
      - /api/.venv

  migrate:
    build:
      target: dev
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    volumes:
      # New migration files written on the host are picked up immediately.
      - ./apps/api:/api
      - /api/.venv

  keycloak:
    environment:
      KC_HOSTNAME: http://localhost:${WEB_PORT:-5173}/auth
      TRIAGE_PUBLIC_URL: http://localhost:${WEB_PORT:-5173}

  web:
    build:
      target: dev
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules

  grafana:
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

  prometheus:
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  alertmanager:
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"

  jaeger:
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
