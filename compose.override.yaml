# Development overrides, merged automatically by plain `docker compose ...`.
# Source is bind-mounted for hot reload. Ports bind to 127.0.0.1 unless
# BIND_ADDR says otherwise, so a dev stack is not reachable from the network
# (published ports bypass host firewalls such as ufw).
services:
  api:
    build:
      target: dev
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8010}:8010"
    volumes:
      - ./apps/api:/api
      # Anonymous volume: keeps the image's .venv visible under the bind
      # mount. It survives rebuilds, so after a dependency change use
      # `make rebuild` (up --build --renew-anon-volumes), not plain --build.
      - /api/.venv

  web:
    build:
      target: dev
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
