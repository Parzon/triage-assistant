# Unit tests for alerts.yml: `make obs-check` (and CI) runs
#   promtool test rules alerts.test.yml
# Each test feeds synthetic series and asserts which alerts fire when.
# "1x5" = a value repeated 5 more times at each interval step.

rule_files:
  - alerts.yml

evaluation_interval: 15s

tests:
  - name: An unreachable identity provider fires after two minutes, on any worker
    interval: 30s
    input_series:
      - series: 'identity_provider_up{instance="api-1"}'
        values: "1 1 0x10"
      - series: 'identity_provider_up{instance="api-2"}'
        values: "1x12"
    alert_rule_test:
      - eval_time: 1m30s
        alertname: IdentityProviderDown
        exp_alerts: []
      - eval_time: 4m
        alertname: IdentityProviderDown
        exp_alerts:
          - exp_labels: {severity: high}
            exp_annotations:
              summary: "the identity provider does not answer: new sign-ins fail (signed-in users are unaffected)"
              runbook_url: "https://github.com/Parzon/triage-assistant/blob/main/docs/runbooks/alerts.md#identityproviderdown"

  - name: Sign-ins failing fires only when none succeeds
    interval: 1m
    input_series:
      # One failed callback a minute, and no successful one ever: the "ok"
      # series does not exist, which the rule must treat as zero.
      - series: 'auth_logins_total{outcome="login_failed"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: SignInsFailing
        exp_alerts:
          - exp_labels: {severity: high}
            exp_annotations:
              summary: "every sign-in in the last 15 minutes failed"
              runbook_url: "https://github.com/Parzon/triage-assistant/blob/main/docs/runbooks/alerts.md#signinsfailing"

  - name: A few failed sign-ins among successful ones are normal
    interval: 1m
    input_series:
      - series: 'auth_logins_total{outcome="login_failed"}'
        values: "0+1x30"
      - series: 'auth_logins_total{outcome="ok"}'
        values: "0+3x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: SignInsFailing
        exp_alerts: []

  - name: Redis down fires only after one minute
    interval: 15s
    input_series:
      - series: redis_up
        values: "1 0x10"
    alert_rule_test:
      - eval_time: 45s
        alertname: RedisDown
        exp_alerts: []
      - eval_time: 90s
        alertname: RedisDown
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Redis (Valkey) is down: rate limiting is off (fail-open, ADR-0004)"
              runbook_url: "https://github.com/Parzon/triage-assistant/blob/main/docs/runbooks/alerts.md#redisdown"

  - name: High error rate needs 5% of requests failing for 5 minutes
    interval: 1m
    input_series:
      # 100 requests/min, 10 of them 500s = 10%
      - series: 'http_requests_total{route="/alerts",status="201",method="POST"}'
        values: "0+90x15"
      - series: 'http_requests_total{route="/alerts",status="500",method="POST"}'
        values: "0+10x15"
    alert_rule_test:
      - eval_time: 4m
        alertname: HighErrorRate
        exp_alerts: []
      - eval_time: 11m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels: {severity: high}
            exp_annotations:
              summary: "more than 5% of api requests fail with 5xx"
              runbook_url: "https://github.com/Parzon/triage-assistant/blob/main/docs/runbooks/alerts.md#higherrorrate"

  - name: Truncated answers are not model errors, but have their own warning
    interval: 1m
    input_series:
      # 10 answers/min: 7 whole, 3 cut off by the output limit = 30%
      - series: 'llm_requests_total{model="m",outcome="ok"}'
        values: "0+7x40"
      - series: 'llm_requests_total{model="m",outcome="truncated"}'
        values: "0+3x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: LLMErrors
        exp_alerts: []
      - eval_time: 10m
        alertname: LLMAnswersTruncated
        exp_alerts: []
      - eval_time: 35m
        alertname: LLMAnswersTruncated
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "more than 10% of answers are cut off by the output limit"
              runbook_url: "https://github.com/Parzon/triage-assistant/blob/main/docs/runbooks/alerts.md#llmanswerstruncated"

  - name: A removed api service is caught by absent()
    interval: 15s
    input_series:
      - series: 'up{job="postgres",instance="postgres-exporter:9187"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 2m
        alertname: ApiMissing
        exp_alerts:
          - exp_labels: {severity: critical, job: api}
            exp_annotations:
              summary: "no api replica exists to scrape"
              runbook_url: "https://github.com/Parzon/triage-assistant/blob/main/docs/runbooks/alerts.md#apimissing"

  - name: Disk trend fires before the disk is full
    interval: 1m
    input_series:
      # 100 GB disk losing 5 GB per 10 min: empty in ~3h
      - series: 'node_filesystem_avail_bytes{mountpoint="/"}'
        values: "60e9-0.5e9x120"
      - series: 'node_filesystem_size_bytes{mountpoint="/"}'
        values: "100e9x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: DiskWillFillIn6h
        exp_alerts:
          - exp_labels: {severity: high, mountpoint: "/"}
            exp_annotations:
              summary: "at the current rate the root disk is full within 6 hours"
              runbook_url: "https://github.com/Parzon/triage-assistant/blob/main/docs/runbooks/alerts.md#diskwillfillin6h--diskalmostfull"
      - eval_time: 90m
        alertname: DiskAlmostFull
        exp_alerts: []

  - name: Event loop lag alert fires on sustained saturation, not a blip
    interval: 15s
    input_series:
      # every observation lands in the 0.25s bucket or above: p95 ~ 0.25s
      - series: 'event_loop_lag_seconds_bucket{le="0.1"}'
        values: "0+0x40"
      - series: 'event_loop_lag_seconds_bucket{le="0.25"}'
        values: "0+4x40"
      - series: 'event_loop_lag_seconds_bucket{le="+Inf"}'
        values: "0+4x40"
    alert_rule_test:
      - eval_time: 3m
        alertname: EventLoopLagHigh
        exp_alerts: []
      - eval_time: 9m
        alertname: EventLoopLagHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "api event loop lag p95 above 100ms: workers are saturated or something blocks the loop"
              runbook_url: "https://github.com/Parzon/triage-assistant/blob/main/docs/runbooks/alerts.md#eventlooplaghigh"

  - name: App database pool exhaustion needs two minutes above 90%
    interval: 15s
    input_series:
      - series: 'db_pool_connections_in_use{job="api",instance="api:8010"}'
        values: "10x4 38x20"
      - series: 'db_pool_connections_max{job="api",instance="api:8010"}'
        values: "40x24"
    alert_rule_test:
      - eval_time: 2m
        alertname: AppDatabasePoolExhausted
        exp_alerts: []
      - eval_time: 4m
        alertname: AppDatabasePoolExhausted
        exp_alerts:
          - exp_labels: {severity: high}
            exp_annotations:
              summary: "the api's database pools are over 90% in use: requests will wait, then fail with 503"
              runbook_url: "https://github.com/Parzon/triage-assistant/blob/main/docs/runbooks/alerts.md#appdatabasepoolexhausted"

  - name: An OOM kill alerts at once and clears five minutes later
    interval: 15s
    input_series:
      - series: 'container_oom_events_total{container_label_com_docker_compose_service="api"}'
        values: "0x4 1x40"
    alert_rule_test:
      - eval_time: 30s
        alertname: ContainerOOMKilled
        exp_alerts: []
      - eval_time: 2m
        alertname: ContainerOOMKilled
        exp_alerts:
          - exp_labels: {severity: high, container_label_com_docker_compose_service: api}
            exp_annotations:
              summary: "out of memory: the kernel killed a process in api"
              runbook_url: "https://github.com/Parzon/triage-assistant/blob/main/docs/runbooks/alerts.md#containeroomkilled"
      - eval_time: 8m
        alertname: ContainerOOMKilled
        exp_alerts: []
