# Shared settings for every location that proxies to the api.

# HTTP/1.1 + an empty Connection header let nginx reuse upstream
# connections (the upstream keepalive pool); HTTP/1.0 closes each one.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Request-ID $request_id;
# Overwrite, never append: nginx is the edge, so a client-supplied
# X-Forwarded-For is discarded and cannot be used to dodge rate limits.
# Behind a load balancer, enable the realip module (set_real_ip_from the
# LB's subnet, real_ip_header X-Forwarded-For) so $remote_addr is the real
# client before it is written here.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $client_scheme;

proxy_connect_timeout 2s;
proxy_send_timeout 30s;
