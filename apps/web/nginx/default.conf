# Production nginx for the web image (nginxinc/nginx-unprivileged, runs as
# a non-root user on 8080). Serves the built SPA and reverse-proxies /api/*
# to the api service. This file is included inside the image's http {}
# block, so http-level directives are valid here.

server_tokens off;

log_format json_combined escape=json
  '{"ts":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

gzip on;
gzip_min_length 1024;
# text/event-stream is deliberately absent: compressing a stream makes
# nginx hold bytes back until a compression block fills.
gzip_types text/css application/javascript application/json image/svg+xml;

# Docker's embedded DNS. `resolve` makes nginx re-resolve `api` at runtime,
# so a recreated api container (new IP) is picked up without an nginx
# restart, and nginx starts even if api does not exist yet.
resolver 127.0.0.11 valid=10s ipv6=off;

# Behind the TLS edge or a cloud load balancer, the connection comes from
# the proxy: take the client's address from the X-Forwarded-For it sets, or
# every user shares one address - and one rate limit. Trusted only from
# private ranges (the Docker network, a VPC); the edge overwrites whatever
# X-Forwarded-For a client sends, so it cannot be forged through it.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# The scheme the client used: https when the edge terminated TLS.
map $http_x_forwarded_proto $client_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream api_backend {
    zone api_backend 64k;
    server api:8010 resolve;
    keepalive 16;
    # Below gunicorn's keepalive (75s): the side that closes idle
    # connections first must be the proxy, never the backend.
    keepalive_timeout 60s;
}

server {
    listen 8080;
    access_log /dev/stdout json_combined;
    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # When nginx itself answers for the api (api down, unreachable, too
    # slow), it answers in the api's error format: clients parse one shape,
    # and the request id still finds this request in the nginx log. Only
    # nginx's own errors: the api's JSON 503s pass through untouched
    # (proxy_intercept_errors stays off). The status code is kept.
    error_page 502 504 @api_error;
    location @api_error {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header Retry-After 5 always;
        return 200 '{"error":{"code":"upstream_unavailable","message":"the service is unavailable, retry shortly","request_id":"$request_id"}}\n';
    }

    # Internal endpoints: Prometheus scrapes /metrics and Alertmanager posts
    # its webhook on the private network; neither is served to the outside.
    location = /api/metrics { return 404; }
    location = /api/alerts/alertmanager { return 404; }

    # Streaming (SSE): every event must reach the browser the moment the
    # api writes it. Buffering is on by default in nginx and would deliver
    # the whole answer at once.
    location = /api/chat/stream {
        proxy_pass http://api_backend/chat/stream;
        include /etc/nginx/snippets/proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        # Max silence between two reads from the api, not total duration.
        # The api sends a keep-alive comment while the model is thinking.
        proxy_read_timeout 120s;
    }

    location /api/ {
        # Trailing slash strips /api, matching the Vite dev proxy.
        proxy_pass http://api_backend/;
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 30s;
    }

    # Vite puts a content hash in every asset filename, so they can be
    # cached forever; a new build produces new names.
    location /assets/ {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must be revalidated on every load, or browsers keep
    # running the previous release after a deploy.
    location / {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
