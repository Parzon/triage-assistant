server {
    listen 8080;

    # Reverse proxy to the api service - the production equivalent of
    # Vite's dev-only proxy in vite.config.ts. Trailing slash on
    # proxy_pass strips the /api prefix, same behavior as the dev
    # proxy's rewrite rule - the two stay in parity on purpose.
    location /api/ {
        proxy_pass http://api:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: any unmatched path serves index.html so client-side
    # routing works on a hard refresh / direct link.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
