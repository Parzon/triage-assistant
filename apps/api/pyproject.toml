[project]
name = "api"
version = "0.1.0"
description = "triage-assistant API: alert intake, triage chat (LLM streaming), health/readiness"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "gunicorn>=26.2.0",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "uvicorn-worker>=0.4",
    "uvicorn[standard]>=0.53",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
