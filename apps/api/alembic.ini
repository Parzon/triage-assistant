[alembic]
script_location = %(here)s/migrations
# Sortable, self-describing filenames: 20260922_1a2b3c4d5e6f_create_alerts.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
# The database URL is read from the environment in migrations/env.py,
# never from this file.

# Every generated migration is formatted like the rest of the code.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
