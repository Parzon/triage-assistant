# Retrieval benchmark: questions about the runbooks in evals/runbooks/, each
# labelled with the section(s) that answer it, as heading paths ("Title >
# Section"). `python -m evals --target retrieval` saves the runbooks through
# the api, asks every question in every search mode, and reports
# recall@k and MRR per mode.
#
# The asker sees every team of the corpus: other teams' runbooks are
# distractors here. Isolation between teams is tested elsewhere (the
# isolation eval cases, and tests/integration/test_runbooks.py).
#
# notes says what a question probes:
# - "paraphrase": shares no telling word with its answer; only meaning finds it.
# - "identifier": names something exact (a command, a flag, a column).
# - "negative": no runbook answers it; relevant is empty. For these, the
#   report shows the best match's cosine distance: can a cutoff separate
#   them from real matches?

[[question]]
id = "disk-free-space"
query = "db-1's disk is at 96%, how do I get space back?"
relevant = ["Disk full on a database host > Free space"]

[[question]]
id = "disk-what-uses-space"
query = "which directories are eating the storage on the postgres box?"
relevant = ["Disk full on a database host > Check what is using space"]
notes = "paraphrase: 'storage', 'box' instead of 'disk', 'host'"

