# Accepted vulnerabilities (make scan, make scan-compose; ADR-0022). A
# finding goes here only when it cannot be fixed now: no fixed version is
# used by the image yet, or the vulnerable code is shown to be unreachable.
# Each entry needs:
#   statement:  why it is safe for now, and who accepted it
#   expired_at: at most 90 days out; Trivy reports it again after that
# scripts/check_trivyignore.py refuses an entry without both, and the code
# owners must approve every change to this file (.github/CODEOWNERS).
#
#   vulnerabilities:
#     - id: CVE-2026-12345
#       paths: ["usr/lib/libexample.so.1"]
#       statement: "Only reachable through X, which this image never runs. Accepted by @lead."
#       expired_at: 2026-12-01
vulnerabilities:
  # The TLS edge's Caddy binary (tools/edge), 2.11.7: still built against
  # golang.org/x/net v0.59.0 and Go 1.26.8. Caddy's own master branch
  # already requires x/net v0.60.0 (the fix), but no tagged release
  # carries it yet. Denial of service only (excessive HTTP/2 SETTINGS
  # frames, a crafted Range header, repeated ECH outer extensions); the
  # edge is the one internet-facing service, so this expires early. The
  # way out before then: build Caddy with xcaddy pinning
  # golang.org/x/net/http2@v0.60.0 on a patched Go.
  - id: CVE-2026-78667
    paths: ["usr/bin/caddy"]
    statement: "No fixed Caddy release yet: 2.11.7 still needs golang.org/x/net v0.60.0, which only Caddy's master branch has. Checked 2026-10-20. Accepted by the code owner (@Parzon)."
    expired_at: 2026-12-27
  - id: CVE-2026-78669
    paths: ["usr/bin/caddy"]
    statement: "No fixed Caddy release yet: 2.11.7 still needs golang.org/x/net v0.60.0, which only Caddy's master branch has. Checked 2026-10-20. Accepted by the code owner (@Parzon)."
    expired_at: 2026-12-27
  - id: CVE-2026-97031
    paths: ["usr/bin/caddy"]
    statement: "No fixed Caddy release yet: 2.11.7 still needs golang.org/x/net v0.60.0, which only Caddy's master branch has. Checked 2026-10-20. Accepted by the code owner (@Parzon)."
    expired_at: 2026-12-27

