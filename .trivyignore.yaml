# Accepted vulnerabilities (make scan, make scan-compose; ADR-0022). A
# finding goes here only when it cannot be fixed now: no fixed version is
# used by the image yet, or the vulnerable code is shown to be unreachable.
# Each entry needs:
#   statement:  why it is safe for now, and who accepted it
#   expired_at: at most 90 days out; Trivy reports it again after that
# scripts/check_trivyignore.py refuses an entry without both, and the code
# owners must approve every change to this file (.github/CODEOWNERS).
#
#   vulnerabilities:
#     - id: CVE-2026-12345
#       paths: ["usr/lib/libexample.so.1"]
#       statement: "Only reachable through X, which this image never runs. Accepted by @lead."
#       expired_at: 2026-12-01
vulnerabilities:
  # The api image's Debian base (python:3.13-slim). Debian fixed all three
  # in its security archive (openssl 3.5.7-1~deb13u3, pcre2
  # 10.46-1~deb13u3); the official image still ships deb13u2, and this
  # waits for its rebuild. QUIC (75804) and DTLS (84782) are not served by
  # this image: Python's ssl module speaks TLS over TCP only. PCRE2 (103111)
  # is linked only by grep and libselinux, which the app never runs:
  # Python's re is its own engine.
  # Short expiry: bump the base digest as soon as the image is rebuilt.
  - id: CVE-2026-75804
    statement: "Fixed in Debian openssl 3.5.7-1~deb13u3, not yet in python:3.13-slim; QUIC is not used by this image. Accepted by the code owner (@Parzon), 2026-09-30."
    expired_at: 2026-10-14
  - id: CVE-2026-84782
    statement: "Fixed in Debian openssl 3.5.7-1~deb13u3, not yet in python:3.13-slim; DTLS is not used by this image. Accepted by the code owner (@Parzon), 2026-09-30."
    expired_at: 2026-10-14
  - id: CVE-2026-103111
    statement: "Fixed in Debian pcre2 10.46-1~deb13u3, not yet in python:3.13-slim; only grep and libselinux link PCRE2, and the app runs neither. Accepted by the code owner (@Parzon), 2026-10-01."
    expired_at: 2026-10-14
  # The TLS edge's Caddy binary (tools/edge). 2.11.4 is the newest release,
  # built with Go 1.26.3 and older golang.org/x modules; the fixes exist
  # upstream but in no Caddy release yet (caddyserver/caddy#8055 asks for
  # 2.11.5). Mostly denial of service in TLS, HTTP/2, URL and certificate
  # parsing: the edge is the one internet-facing service, so this expires
  # early. The way out before then: build Caddy with xcaddy on a patched Go.
  - id: CVE-2026-27145
    paths: ["usr/bin/caddy"]
    statement: "No fixed Caddy release yet (caddyserver/caddy#8055). Proposed with the scan's introduction; accepted by the code owners' approval."
    expired_at: 2026-10-25
