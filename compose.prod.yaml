# Production shape: images from the `production` Dockerfile targets, no
# source mounts, only nginx published, least privilege everywhere.
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# (`make prod-up` runs this under the project name triage-assistant-prod so
# it can sit next to a dev stack with separate volumes.)
services:
  api:
    build:
      target: production
    image: ${IMAGE_PREFIX:-triage-assistant}-api:${IMAGE_TAG:-local}
    environment:
      APP_ENV: prod
      # Worker count follows the CPU limit below (gunicorn.conf.py). To pin
      # it, add WEB_CONCURRENCY: "<n>" - never an empty value: gunicorn
      # parses WEB_CONCURRENCY at import time and crashes on "".
      # Only nginx can reach the api (it publishes no ports), and nginx
      # overwrites X-Forwarded-For, so trusting any peer here is safe.
      FORWARDED_ALLOW_IPS: "*"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # > gunicorn graceful_timeout (120s), or Docker SIGKILLs in-flight
    # streams during a deploy/stop.
    stop_grace_period: 130s
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-2}"
          memory: 1g
    # Swap allowance = memswap_limit - memory limit. Without this line Docker
    # allows as much again in swap (memswap = 2x memory) on a host that has
    # swap: a leak then degrades silently instead of an OOM kill that
    # alerts and self-heals (make drills d="oom oom-swap"). Kubernetes and
    # ECS run containers without swap; so does every service here.
    memswap_limit: 1g

  migrate:
    build:
      target: production
    image: ${IMAGE_PREFIX:-triage-assistant}-api:${IMAGE_TAG:-local}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      target: production
    image: ${IMAGE_PREFIX:-triage-assistant}-web:${IMAGE_TAG:-local}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    memswap_limit: 256m

  # Only with COMPOSE_PROFILES=mock (demos without a provider). Idle: ~50MiB.
  mock-llm:
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    memswap_limit: 256m

  pgbouncer:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    memswap_limit: 128m

  db:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    memswap_limit: 1g

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    memswap_limit: 256m

  # Observability. Dashboards listen on the VM's loopback only: reach them
  # through an SSH tunnel (ssh -L 3000:127.0.0.1:3000 <vm>), never on a
  # public interface. Limits sized from measured idle use (make obs-up;
  # docker stats) with headroom: grafana ~320MiB, prometheus ~64MiB (grows
  # with series count and retention), exporters 10-30MiB each.
  grafana:
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 512m
    memswap_limit: 512m

  prometheus:
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    deploy:
      resources:
        limits:
          memory: 1g
    memswap_limit: 1g

  alertmanager:
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    deploy:
      resources:
        limits:
          memory: 128m
    memswap_limit: 128m

  cadvisor:
    deploy:
      resources:
        limits:
          memory: 256m
    memswap_limit: 256m

  postgres-exporter:
    deploy: {resources: {limits: {memory: 64m}}}
    memswap_limit: 64m

  pgbouncer-exporter:
    deploy: {resources: {limits: {memory: 64m}}}
    memswap_limit: 64m

  redis-exporter:
    deploy: {resources: {limits: {memory: 64m}}}
    memswap_limit: 64m

  node-exporter:
    deploy: {resources: {limits: {memory: 64m}}}
    memswap_limit: 64m
