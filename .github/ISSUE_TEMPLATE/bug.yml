name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, requests, or steps in the UI. The smallest that shows it.
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request id
      description: From the error message or the X-Request-ID header - it finds the log lines (`make trace id=...`).
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [dev stack (make up), production-shaped stack (make prod-up), CI, a server]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: text
