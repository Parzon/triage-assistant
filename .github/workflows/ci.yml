name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the GITHUB_TOKEN: these jobs only read the repo.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (tags can be moved to malicious
# code, as in the 2025 tj-actions/changed-files compromise). Dependabot
# keeps the SHAs and the version comments current.

jobs:
  lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: apps/api
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Observability config (Prometheus config, alert rule unit tests, Alertmanager config)
        working-directory: .
        run: make obs-check
      - name: Shell scripts (deploy, restore, drills)
        working-directory: .
        run: make shellcheck

  test-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact command developers run: a throwaway compose stack with real
      # Postgres, PgBouncer and Valkey, migrations + `alembic check`, then
      # pytest with the coverage gate from pyproject.toml.
      - run: cp .env.example .env
      - run: make test-api
      - name: Coverage summary
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("apps/api/coverage.xml").getroot()
          print(f"### API coverage: {float(root.get('line-rate')) * 100:.1f}% lines, "
                f"{float(root.get('branch-rate')) * 100:.1f}% branches")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the production api image and asserts: runs as UID 10001, no
      # dev tooling inside, every module imports under a read-only rootfs.
      - run: make image-check

  web-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build production web image and validate its nginx config
        run: |
          docker build --target production -t triage-assistant-web:ci .
          docker run --rm --entrypoint nginx triage-assistant-web:ci -t

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The production-shaped stack exactly as `make prod-up` runs it
      # (nginx, gunicorn, read-only containers), with the mock LLM.
      - run: cp .env.example .env
      - run: make prod-up
      - name: Browser tests through nginx
        run: make e2e
      - name: Stack logs
        if: failure()
        run: docker compose -p triage-assistant-prod -f compose.yaml -f compose.prod.yaml logs --no-color --tail=200
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
