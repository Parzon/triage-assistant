name: Weekly scan

# New vulnerabilities are published every day, in images nobody changed:
# this repo's own images, rebuilt from main, and the compose files'
# third-party images (Postgres, PgBouncer, Valkey, Keycloak, the monitoring
# stack). A finding in our own images turns the run red: bump the base, or
# accept the risk in .trivyignore.yaml with a reason and an expiry date
# (ADR-0022). The third-party scan only reports (ADR-0026): read its log
# when you bump those images.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-images:
    runs-on: ubuntu-24.04
    # Hundreds of findings in images this repo does not build: a run that
    # is red every week teaches people to ignore red (ADR-0026).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The compose files interpolate .env: one made from the template is
      # enough to list the images.
      - run: make .env
      - name: Third-party images the compose files run
        run: make scan-compose

  own-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: This repo's production images, rebuilt from main
        run: make scan
      # Findings with no fix yet: `make scan` cannot fail on them, so they are listed here,
      # never failing, to be read with the weekly run and revisited when a fix appears.
      - name: Every HIGH/CRITICAL finding, fixable or not (report only)
        if: always()
        run: make scan-unfixed
