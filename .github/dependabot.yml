# Dependency update PRs, weekly and grouped (one PR per ecosystem, not one
# per package). Each is an ordinary PR: CI must pass before merging, and a
# major version gets read like any other change. GitHub Actions stay pinned
# to commit SHAs; Dependabot moves the SHA and its version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: uv
    directory: /apps/api
    schedule: {interval: weekly}
    groups:
      api-minor-and-patch: {update-types: [minor, patch]}

  - package-ecosystem: npm
    directory: /apps/web
    schedule: {interval: weekly}
    ignore:
      # The Node types follow the Node runtime's major (apps/web/.nvmrc),
      # not npm's newest release.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      web-minor-and-patch: {update-types: [minor, patch]}

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule: {interval: weekly}
    groups:
      e2e: {patterns: ["*"]}

  # Base images in the Dockerfiles. Images named in the compose files
  # (postgres, valkey, pgbouncer, the monitoring stack) are bumped by hand:
  # a new major Postgres needs a data migration, not just a new tag.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /tools/mock-llm
      - /tools/py-spy
      - /tools/load/vegeta
      - /tools/load/jmeter
    schedule: {interval: weekly}
    ignore:
      # Language runtimes move deliberately and together: Python with the
      # api's PYTHON_VERSION and requires-python, Node with .nvmrc, Java
      # with JMeter's supported versions - not one tool image at a time.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
    groups:
      base-images: {patterns: ["*"]}
