# Test overlay, used by `make test` (locally and in CI, same command):
#   docker compose -p triage-assistant-test \
#     -f compose.yaml -f compose.override.yaml -f compose.test.yaml run --rm api pytest
# A separate project name means separate containers, network and volumes:
# tests never see dev data, and `make test` deletes everything afterwards.
services:
  api:
    environment:
      APP_ENV: test
      # Small limits and short timeouts keep the failure-mode tests fast.
      ALERTS_RATE_LIMIT: "5"
      CHAT_RATE_LIMIT: "30"
      LLM_READ_TIMEOUT_S: "1"
      LLM_MAX_RETRIES: "0"
      SSE_HEARTBEAT_S: "0.2"
      MOCK_LLM_ADMIN_URL: http://mock-llm:8020/_admin
    depends_on:
      # Test-only: the chat tests drive the mock's failure modes.
      mock-llm:
        condition: service_healthy

  db:
    # Durability off: a test database that loses data on a crash is fine,
    # and every commit skips the disk flush.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
