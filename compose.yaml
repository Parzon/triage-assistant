# Base definition shared by every environment. It is never run alone:
#   dev   docker compose up -d        (compose.override.yaml is merged automatically)
#   prod  docker compose -f compose.yaml -f compose.prod.yaml up -d
# `docker compose [-f ...] config` prints the fully merged result.
name: triage-assistant

x-logging: &logging
  # Docker keeps container stdout in a JSON file per container, unbounded by
  # default: without rotation a chatty service eventually fills the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The release this api runs (deploy.sh exports IMAGE_TAG): on traces
      # (service.version) and in app_info.
      APP_VERSION: ${IMAGE_TAG:-dev}
      # Traces (ADR-0018): off unless an OTLP endpoint is set. make obs-up
      # sets it to the jaeger service below.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      TRACE_EXPORT_TIMEOUT_S: ${TRACE_EXPORT_TIMEOUT_S:-2}
      # Questions, prompts and answers on spans (redacted): development only.
      TRACE_CONTENT: ${TRACE_CONTENT:-false}
      # The app role, through PgBouncer. Plain postgresql:// - the app picks
      # the async driver itself.
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # nginx and the Vite dev proxy serve the api under /api.
      ROOT_PATH: /api
      # Any OpenAI-compatible endpoint. Default: the mock below. Deliberately
      # no depends_on it: the LLM is an external dependency - the api must
      # start without it and report its failures, not refuse to boot.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://mock-llm:8020/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-mock-1}
      # Reasoning models only (low | medium | high); empty = not sent.
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      # Runbook search (ADR-0017): embeddings from the same endpoint. Empty
      # EMBEDDING_MODEL = runbooks off. Real models and their prefixes:
      # .env.example.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_QUERY_PREFIX: ${EMBEDDING_QUERY_PREFIX:-}
      EMBEDDING_DOCUMENT_PREFIX: ${EMBEDDING_DOCUMENT_PREFIX:-}
      # Runbook sections per answer (0: alerts only).
      RAG_CONTEXT_CHUNKS: ${RAG_CONTEXT_CHUNKS:-4}
      # Per client per minute. Load tests raise them (make load).
      ALERTS_RATE_LIMIT: ${ALERTS_RATE_LIMIT:-60}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-10}
      RUNBOOKS_RATE_LIMIT: ${RUNBOOKS_RATE_LIMIT:-60}
      # Shared with Alertmanager (secret below); empty = webhook disabled.
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:-}
      # Sign-in (OIDC, ADR-0013). Defaults: the bundled Keycloak below, which
      # browsers reach under <PUBLIC_URL>/auth and the api directly. The dev
      # and test overlays set their own addresses. A real provider: see
      # .env.example.
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
      OIDC_ISSUER: ${OIDC_ISSUER:-${PUBLIC_URL:-https://localhost}/auth/realms/triage}
      # "-", not ":-": an empty value in .env must stay empty (a real provider).
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL-http://keycloak:8080/auth/realms/triage/.well-known/openid-configuration}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-triage-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # The api's other settings (app/config.py; the handbook's settings
      # reference): passed when .env or the shell sets them, and absent
      # otherwise, so the code's default applies - for these first ones, a
      # default that differs in production (APP_ENV=prod, ADR-0023). A
      # variable compose does not list never reaches the container, whatever
      # .env says.
      DOCS_ENABLED:
      OTEL_TRACES_SAMPLER:
      OTEL_TRACES_SAMPLER_ARG:
      CHAT_RATE_LIMIT_FAIL_CLOSED:
      PROD_CHECKS_WAIVED:
      DB_POOL_SIZE:
      DB_MAX_OVERFLOW:
      DB_POOL_TIMEOUT_S:
      DB_CONNECT_TIMEOUT_S:
      RATELIMIT_TIMEOUT_S:
      REDIS_MAX_CONNECTIONS:
      RATELIMIT_WINDOW_S:
      AUTH_RATE_LIMIT:
      LLM_CONNECT_TIMEOUT_S:
      LLM_READ_TIMEOUT_S:
      LLM_MAX_RETRIES:
      LLM_STREAM_TIMEOUT_S:
      SSE_HEARTBEAT_S:
      LLM_MAX_OUTPUT_TOKENS:
      CHAT_CONTEXT_ALERTS:
      CHAT_MODE:
      AGENT_MAX_STEPS:
      EMBEDDING_TIMEOUT_S:
      OIDC_SCOPES:
      OIDC_TIMEOUT_S:
      SESSION_MAX_AGE_S:
      SESSION_IDLE_TIMEOUT_S:
      SESSION_COOKIE_SECURE:
      OTEL_SERVICE_NAME:
      USER_RETENTION_DAYS:
      ALERT_RETENTION_DAYS:
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
    # Deliberately no depends_on the identity provider either: the api starts
    # without it, and sessions already issued keep working while it is down.
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    logging: *logging

  # One-shot: applies migrations, then exits 0. `up` re-runs it every time
  # (a no-op when the schema is current); the api waits for it to succeed.
  migrate:
    build:
      context: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The schema owner, directly to Postgres (not through PgBouncer).
      MIGRATIONS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  # Stand-in for the LLM provider (tools/mock-llm): OpenAI-compatible, with
  # tunable latency and failure modes. Runs when the "mock" profile is
  # active - COMPOSE_PROFILES=mock in .env, the default for local work.
  mock-llm:
    build:
      context: ./tools/mock-llm
    profiles: ["mock"]
    restart: unless-stopped
    logging: *logging

  # A real model on this machine, served OpenAI-compatibly at
  # http://ollama:11434/v1: for evals and realistic latency without a
  # provider key. Profile "ollama"; `make ollama-pull m=<model>` downloads
  # one. The GPU reservation needs an NVIDIA GPU and the NVIDIA container
  # toolkit; on a Mac, run the Ollama app natively instead (containers cannot
  # use Apple's GPU) and point LLM_BASE_URL at
  # http://host.docker.internal:11434/v1.
  ollama:
    image: ollama/ollama:0.34.3
    profiles: ["ollama"]
    environment:
      # Unload a model after 5 idle minutes: its GPU memory goes back.
      OLLAMA_KEEP_ALIVE: 5m
      # How many answers one model generates at once (batched on the GPU).
      # 1: the rest wait in line; throughput does not grow with load
      # (docs/handbook/ai-cost.md has both measured).
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging

  # Stand-in for the organisation's identity provider, as mock-llm is for the
  # model provider: Keycloak with a demo realm (infra/keycloak/triage-realm.json
  # - the client, the team groups, four demo users). Profile "idp", on by
  # default (COMPOSE_PROFILES in .env); with a real provider, drop the profile
  # and set the OIDC_* variables. Development mode, its database inside the
  # container, the realm imported from the file whenever the container is
  # created: fine for development, CI and demos - never the production IdP.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    profiles: ["idp"]
    # Refuses to start - rather than create demo users with an empty
    # password - when .env lacks the passwords. (A compose-level ${VAR:?}
    # would stop every stack, even those not using this profile.)
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        : "$${DEMO_USER_PASSWORD:?set DEMO_USER_PASSWORD in .env}"
        "$${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}"
        && exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      # Served under /auth, so browsers reach it on the app's own origin:
      # through the edge in the production shape, the Vite proxy in dev.
      KC_HTTP_RELATIVE_PATH: /auth
      # The address browsers use; ID tokens name it as their issuer. The api
      # calls keycloak:8080 directly instead: with a dynamic back channel,
      # Keycloak answers those calls with keycloak:8080 URLs.
      KC_HOSTNAME: ${PUBLIC_URL:-https://localhost}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # The edge's X-Forwarded-* headers: the client's real address, for
      # brute-force protection.
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Values for the ${...} placeholders in the realm file.
      TRIAGE_PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    # In every environment: the JVM sizes its heap from the memory it can
    # see. Without a limit it took 1.1 GiB on a 62 GiB host; with this one,
    # ~430 MiB.
    deploy:
      resources:
        limits:
          memory: 1g
    memswap_limit: 1g
    healthcheck:
      # No curl or wget in the image; bash speaks enough HTTP. Health lives
      # on the management port, 9000, under the same /auth prefix.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      POOL_MODE: transaction
      # Postgres stores passwords as SCRAM. With the image's default (md5)
      # PgBouncer cannot answer the server's SCRAM challenge: every real
      # query fails with "server login failed: wrong password type".
      AUTH_TYPE: scram-sha-256
      # Real server connections per database/user pair, and how many
      # clients (app connections) may queue for them.
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 500
      # May run SHOW STATS/POOLS on the admin console (pgbouncer-exporter).
      STATS_USERS: ${APP_DB_USER}
      # Fail fast when Postgres is down or frozen (make drills d="db-stop
      # db-hang"). PgBouncer defaults in brackets.
      # A client waits this long for a server connection, then gets an error [120s].
      QUERY_WAIT_TIMEOUT: 5
      # Cancels a query running this long and closes its connections [off].
      # A backstop for when Postgres cannot enforce the role's 10s
      # statement_timeout itself (frozen, partitioned): keep it above 10s.
      QUERY_TIMEOUT: 15
      # A new server connection must be up within this [15s].
      SERVER_CONNECT_TIMEOUT: 5
      # After a failed login to Postgres, retry after this long [15s] - which
      # is also how long clients keep getting "server login has been
      # failing" once Postgres is back.
      SERVER_LOGIN_RETRY: 2
      # A stopped container vanishes from Docker's DNS, and PgBouncer caches
      # that "no such host" answer [15s]: Postgres would be back while
      # PgBouncer still failed every login from its cache.
      DNS_NXDOMAIN_TTL: 1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Speaks the Postgres protocol, so pg_isready works - but note it does
      # not authenticate; /ready on the api is the check that proves the
      # whole path (auth included).
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  db:
    # PostgreSQL 17 with the pgvector extension (runbook search, ADR-0017).
    # The official postgres:17 image plus one extension: the same Debian 13
    # and glibc 2.41, so text collations - and every index built on them -
    # are unchanged (a different glibc would make Postgres warn about a
    # collation version mismatch, and text indexes need a REINDEX).
    # Pinned in full; bumped by hand, like every stateful image.
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MONITOR_DB_USER: ${MONITOR_DB_USER}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
    # pg_stat_statements records timing for every distinct query: the first
    # place to look for "which query is slow" (make psql, then the queries
    # in docs/handbook/operations.md).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    # Docker's default 64MB /dev/shm is too small for parallel queries
    # ("could not resize shared memory segment").
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume only.
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ defers expansion to the container's shell (its own env), not compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  redis:
    # Valkey: the Linux Foundation fork of Redis 7.2, BSD-licensed (Redis
    # 7.4+ is RSALv2/SSPLv1; 8.x adds AGPLv3). Same protocol, same clients,
    # so the service keeps the protocol's name. See docs/adr/0002.
    image: valkey/valkey:8.1-alpine
    # Rate-limit counters are disposable: no persistence, bounded memory, and
    # evict old keys instead of refusing writes when full.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # --- Observability (profile "observability") -----------------------------
  # Enable with COMPOSE_PROFILES=mock,observability in .env, or `make obs-up`.
  # Note `docker compose --profile observability ...` REPLACES the profiles
  # from .env (the mock would drop out); list them all instead.

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Both caps: whichever is hit first. Without a size cap, a busy
      # Prometheus on a small VM fills the disk.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      # POST /-/reload re-reads config and rules without a restart.
      - --web.enable-lifecycle
      # Accepts client-side metrics pushed by k6 load tests.
      - --web.enable-remote-write-receiver
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: ["observability"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./infra/observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    # Its config file cannot read environment variables; the webhook token
    # arrives as a file under /run/secrets instead.
    secrets:
      - alertmanager_webhook_token
    restart: unless-stopped
    logging: *logging

  # Traces (ADR-0018). The api sends OTLP/HTTP to :4318 when
  # OTEL_EXPORTER_OTLP_ENDPOINT is set; the UI is :16686.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: ["observability"]
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./infra/observability/jaeger:/etc/jaeger:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:13133/status"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Dashboards readable without login; changing anything needs admin.
      # Behind SSO in a real environment, not open like this.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # No phone-home from inside a corporate network.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    logging: *logging

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    profiles: ["observability"]
    command: ["--collector.stat_statements"]
    environment:
      # A pg_monitor role: can read statistics, nothing else.
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${MONITOR_DB_USER}
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  pgbouncer-exporter:
    image: quay.io/prometheuscommunity/pgbouncer-exporter:v0.12.1
    profiles: ["observability"]
    command:
      - --pgBouncer.connectionString=postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@pgbouncer:5432/pgbouncer?sslmode=disable
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    profiles: ["observability"]
    environment:
      REDIS_ADDR: redis://redis:6379
    restart: unless-stopped
    logging: *logging

  # Host metrics (CPU, memory, disk). In a bridge network its network
  # metrics describe its own container, not the host - fine for the disk
  # and memory alerts that matter here.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: ["observability"]
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    logging: *logging

  # Per-container CPU/memory (the api's multiprocess metrics cannot report
  # process resources). Reads Docker's state from the host, hence privileged.
  # Newer releases are published on ghcr.io; gcr.io stopped at v0.52.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: ["observability"]
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      # Export only these container labels: by default every label of every
      # container becomes a Prometheus label (unbounded cardinality).
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    logging: *logging

secrets:
  alertmanager_webhook_token:
    environment: ALERTMANAGER_WEBHOOK_TOKEN

volumes:
  pgdata:
  ollama-models:
  prometheus-data:
  alertmanager-data:
  grafana-data:
