# Base definition shared by every environment. It is never run alone:
#   dev   docker compose up -d        (compose.override.yaml is merged automatically)
#   prod  docker compose -f compose.yaml -f compose.prod.yaml up -d
# `docker compose [-f ...] config` prints the fully merged result.
name: triage-assistant

x-logging: &logging
  # Docker keeps container stdout in a JSON file per container, unbounded by
  # default: without rotation a chatty service eventually fills the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The app role, through PgBouncer. Plain postgresql:// - the app picks
      # the async driver itself.
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # nginx and the Vite dev proxy serve the api under /api.
      ROOT_PATH: /api
      # Any OpenAI-compatible endpoint. Default: the mock below. Deliberately
      # no depends_on it: the LLM is an external dependency - the api must
      # start without it and report its failures, not refuse to boot.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://mock-llm:8020/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-mock-1}
      # Shared with Alertmanager (secret below); empty = webhook disabled.
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    logging: *logging

  # One-shot: applies migrations, then exits 0. `up` re-runs it every time
  # (a no-op when the schema is current); the api waits for it to succeed.
  migrate:
    build:
      context: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The schema owner, directly to Postgres (not through PgBouncer).
      MIGRATIONS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  # Stand-in for the LLM provider (tools/mock-llm): OpenAI-compatible, with
  # tunable latency and failure modes. Runs when the "mock" profile is
  # active - COMPOSE_PROFILES=mock in .env, the default for local work.
  mock-llm:
    build:
      context: ./tools/mock-llm
    profiles: ["mock"]
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      POOL_MODE: transaction
      # Postgres stores passwords as SCRAM. With the image's default (md5)
      # PgBouncer cannot answer the server's SCRAM challenge: every real
      # query fails with "server login failed: wrong password type".
      AUTH_TYPE: scram-sha-256
      # Real server connections per database/user pair, and how many
      # clients (app connections) may queue for them.
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 500
      # May run SHOW STATS/POOLS on the admin console (pgbouncer-exporter).
      STATS_USERS: ${APP_DB_USER}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Speaks the Postgres protocol, so pg_isready works - but note it does
      # not authenticate; /ready on the api is the check that proves the
      # whole path (auth included).
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MONITOR_DB_USER: ${MONITOR_DB_USER}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
    # pg_stat_statements records timing for every distinct query: the first
    # place to look for "which query is slow" (make psql, then the queries
    # in the handbook's performance chapter).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    # Docker's default 64MB /dev/shm is too small for parallel queries
    # ("could not resize shared memory segment").
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume only.
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ defers expansion to the container's shell (its own env), not compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  redis:
    # Valkey: the Linux Foundation fork of Redis 7.2, BSD-licensed (Redis
    # 7.4+ is RSALv2/SSPLv1; 8.x adds AGPLv3). Same protocol, same clients,
    # so the service keeps the protocol's name. See docs/adr/0002.
    image: valkey/valkey:8.1-alpine
    # Rate-limit counters are disposable: no persistence, bounded memory, and
    # evict old keys instead of refusing writes when full.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # --- Observability (profile "observability") -----------------------------
  # Enable with COMPOSE_PROFILES=mock,observability in .env, or `make obs-up`.
  # Note `docker compose --profile observability ...` REPLACES the profiles
  # from .env (the mock would drop out); list them all instead.

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Both caps: whichever is hit first. Without a size cap, a busy
      # Prometheus on a small VM fills the disk.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      # POST /-/reload re-reads config and rules without a restart.
      - --web.enable-lifecycle
      # Accepts client-side metrics pushed by k6 load tests.
      - --web.enable-remote-write-receiver
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: ["observability"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./infra/observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    # Its config file cannot read environment variables; the webhook token
    # arrives as a file under /run/secrets instead.
    secrets:
      - alertmanager_webhook_token
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Dashboards readable without login; changing anything needs admin.
      # Behind SSO in a real environment, not open like this.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # No phone-home from inside a corporate network.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    logging: *logging

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    profiles: ["observability"]
    command: ["--collector.stat_statements"]
    environment:
      # A pg_monitor role: can read statistics, nothing else.
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${MONITOR_DB_USER}
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  pgbouncer-exporter:
    image: quay.io/prometheuscommunity/pgbouncer-exporter:v0.12.1
    profiles: ["observability"]
    command:
      - --pgBouncer.connectionString=postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@pgbouncer:5432/pgbouncer?sslmode=disable
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    profiles: ["observability"]
    environment:
      REDIS_ADDR: redis://redis:6379
    restart: unless-stopped
    logging: *logging

  # Host metrics (CPU, memory, disk). In a bridge network its network
  # metrics describe its own container, not the host - fine for the disk
  # and memory alerts that matter here.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: ["observability"]
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    logging: *logging

  # Per-container CPU/memory (the api's multiprocess metrics cannot report
  # process resources). Reads Docker's state from the host, hence privileged.
  # Newer releases are published on ghcr.io; gcr.io stopped at v0.52.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: ["observability"]
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      # Export only these container labels: by default every label of every
      # container becomes a Prometheus label (unbounded cardinality).
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    logging: *logging

secrets:
  alertmanager_webhook_token:
    environment: ALERTMANAGER_WEBHOOK_TOKEN

volumes:
  pgdata:
  prometheus-data:
  alertmanager-data:
  grafana-data:
